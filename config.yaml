# PSN gift card tracker configuration
# Secrets (Telegram token / chat id) go in .env, not here.

interval_seconds: 180          # how often to check all stores (3 min)
interval_jitter_seconds: 30    # random +/- so requests don't look robotic
fast_interval_seconds: 60      # extra checks for priority listings (amazon.fast_check); 0 = off
store_timeout_seconds: 120     # give up on a store after this long in one cycle
error_alert_after_failures: 5  # Telegram warning if a store fails this many times in a row
notify_out_of_stock: false     # true = also message when something sells out
state_file: data/state.json

# Which product titles count as "PlayStation gift card"
title_filter:
  include_any: [playstation, psn]
  card_words_any: [gift card, giftcard, wallet, voucher, top up, topup, store card]
  exclude_any: [playstation plus, ps plus, memory card, controller, console, xbox, steam]

stores:
  gyftr:
    enabled: true
    brand_slugs: [sony-playstation]          # https://www.gyftr.com/sony-playstation

  gamestheshop:
    enabled: true
    search_queries: [playstation store gift card]
    max_pages: 3

  digistore:
    enabled: true
    categories: [playstation-card]           # https://digistore.co.in/product-category/console-games/playstation-card/
    search_queries: [PSN]

  flipkart:
    # Stock comes from the search results: every PSN card tile shows "Coming Soon" or
    # "Currently unavailable" unless it can actually be bought. (Product pages are not
    # reliable — they often show "Buy now" for cards that can't be purchased.)
    enabled: true
    # Each of these returns all PSN gift card tiles. If two searches disagree about a
    # card, "unavailable" wins, so a glitch in one search can't cause a false alert.
    search_queries:
      - playstation rs gift card
      - playstation inr gift card
    max_pages: 1

  amazon:
    # Amazon search is blocked from cloud servers, so the bot checks the listings below
    # (via Amazon's mobile product page, which isn't blocked). Paste any Amazon link:
    # full URL, amzn.in share link, or just the 10-character product ID.
    enabled: true
    product_urls:
      - https://www.amazon.in/dp/B093QF35KZ   # Rs.2000 Sony PlayStation Store Gift Card
      - https://amzn.in/d/0gZDa4MB            # B0C1H3K2V4  PlayStation E-Gift Card (Instant Delivery)
    # Also checked every `fast_interval_seconds` (restocks here sell out quickly)
    fast_check:
      - https://amzn.in/d/0aGMkk6l            # B07K6RYVJ5  Rs.4000 Sony PlayStation Store Gift Card
    search_queries: []                        # search is blocked from cloud IPs; leave empty

  jiogames:
    # JioGames Store doesn't sell PSN cards right now; this alerts you if they start.
    enabled: true
    search_queries: [playstation, psn]
