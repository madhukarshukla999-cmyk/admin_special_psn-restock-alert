<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PSN Stock Bot – extension</title>
<style>
  body { font: 14px system-ui, sans-serif; width: 360px; margin: 14px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  label { display: block; margin: 6px 0; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 5px; }
  fieldset { border: 1px solid #ddd; border-radius: 6px; margin: 10px 0; }
  button { padding: 6px 10px; margin-right: 6px; }
  #status { font-weight: 600; }
  #log { font: 12px monospace; background: #f6f6f6; padding: 6px; max-height: 140px; overflow: auto; white-space: pre-wrap; }
  small { color: #666; }
</style>
</head>
<body>
<h2>🎮 PSN Stock Bot</h2>
<div>Connection: <span id="status">–</span></div>

<label>Connection code (send <b>/extension</b> to your bot)
  <input type="text" id="topic" placeholder="psnbot-…">
</label>
<label><input type="checkbox" id="enabled"> On</label>

<fieldset><legend>When a card is back</legend>
  <label><input type="checkbox" id="autoClick"> Click through to checkout (GamesTheShop, Amazon)</label>
  <label><input type="checkbox" id="clickPayNow"> GamesTheShop: also click <b>Pay Now</b> (shows the Paytm QR)</label>
  <label>Your UPI ID (optional – sends the payment request to your UPI app instead of showing the QR)
    <input type="text" id="upiId" placeholder="name@okicici"></label>
  <label><input type="checkbox" id="st_gamestheshop"> GamesTheShop</label>
  <label><input type="checkbox" id="st_amazon"> Amazon</label>
  <label><input type="checkbox" id="st_others"> Other stores (just open the page)</label>
  <label><input type="checkbox" id="sound"> Notification sound</label>
  <label>Ignore cards priced above ₹ (0 = no limit)
    <input type="number" id="maxPrice" min="0" step="100"></label>
</fieldset>

<button id="save">Save</button>
<fieldset><legend>Test</legend>
  <label>Product link (any in-stock GamesTheShop / Amazon product)
    <input type="text" id="testUrl" placeholder="https://www.gamestheshop.com/product/…"></label>
  <button id="test">Run test</button>
  <small>Goes up to checkout like a real alert. Nothing is bought.</small>
</fieldset>

<div id="log"></div>
<p><small>It never pays: you scan the QR, or approve the UPI request, with your own PIN.</small></p>
<script src="options.js"></script>
</body>
</html>
