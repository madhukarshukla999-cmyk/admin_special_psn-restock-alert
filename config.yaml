# PSN gift card tracker configuration
# Secrets (Telegram token / chat id) go in .env, not here.

interval_seconds: 60           # full check of each store (stores can override below; /cycles to change live)
interval_jitter_seconds: 10    # random +/- so requests don't look robotic
fast_interval_seconds: 20      # priority checks (fast_check stores); 0 = off

# Burst mode: check much faster around each store's usual restock time.
# Windows are learned from history (/besttime, needs 3+ restocks on 2+ days) and/or set here.
burst:
  enabled: true
  seconds: 10                  # check interval during a burst
  risky_seconds: 20            # Amazon / Flipkart / Blinkit (they may block very fast checks)
  margin_minutes: 15           # start this much before / end after the learned window
  learn: true
  windows: {}                  # e.g. {amazon: ["12:00-13:30"], jiogames: ["10:45-11:30"]}  (IST)
store_timeout_seconds: 120     # give up on a store after this long in one cycle
error_alert_after_failures: 5  # Telegram warning if a store fails this many times in a row
notify_out_of_stock: true      # sold-out alerts ("was in stock for 6 min"); each person can turn them off in /menu
daily_summary_time: "21:00"    # IST; each person can turn the summary off in /menu
down_alert_minutes: 10         # message everyone if the bot was offline/asleep longer than this
auto_update: true              # pull the latest code from GitHub and restart (needs a git clone)
auto_update_hours: 6           # how often to check for updates (/update checks right away)
state_file: data/state.json
# Telegram /menu to switch store notifications on/off (saved in state_file).
# Only one running copy per bot token can use it — set false on a second copy (e.g. a home Blinkit copy).
telegram_menu: true

# Which product titles count as "PlayStation gift card"
title_filter:
  include_any: [playstation, psn]
  card_words_any: [gift card, giftcard, wallet, voucher, top up, topup, store card]
  exclude_any: [playstation plus, ps plus, memory card, controller, console, xbox, steam]

stores:
  gyftr:
    enabled: true
    brand_slugs: [sony-playstation]          # https://www.gyftr.com/sony-playstation

  gamestheshop:
    enabled: true
    # "gift card" returns only ~17 products (all 8 PSN values among them) in a single page,
    # so a card can't drop off the results just because of ranking changes.
    search_queries: [gift card]
    max_pages: 3

  digistore:
    enabled: true
    categories: [playstation-card]           # https://digistore.co.in/product-category/console-games/playstation-card/
    search_queries: [PSN]

  flipkart:
    # Stock comes from the search results: every PSN card tile shows "Coming Soon" or
    # "Currently unavailable" unless it can actually be bought. (Product pages are not
    # reliable — they often show "Buy now" for cards that can't be purchased.)
    enabled: true
    # Each of these returns all PSN gift card tiles. If two searches disagree about a
    # card, "unavailable" wins, so a glitch in one search can't cause a false alert.
    search_queries:
      - playstation rs gift card
      - playstation inr gift card
    max_pages: 1

  amazon:
    interval_seconds: 120        # all Amazon listings; Amazon may block very frequent checks
    fast_interval_seconds: 30    # the fast_check card(s)
    # Amazon search is blocked from cloud servers, so the bot checks the listings below
    # (via Amazon's mobile product page, which isn't blocked). Paste any Amazon link:
    # full URL, amzn.in share link, or just the 10-character product ID.
    enabled: true
    product_urls:
      - https://www.amazon.in/dp/B093QF35KZ   # Rs.2000 Sony PlayStation Store Gift Card
      - https://amzn.in/d/0gZDa4MB            # B0C1H3K2V4  PlayStation E-Gift Card (Instant Delivery)
    # Also checked every `fast_interval_seconds` (restocks here sell out quickly)
    fast_check:
      - https://amzn.in/d/0aGMkk6l            # B07K6RYVJ5  Rs.4000 Sony PlayStation Store Gift Card
    search_queries: []                        # search is blocked from cloud IPs; leave empty

  blinkit:
    # Blinkit blocks cloud/data-center IPs (Cloudflare 403) but works from a home connection
    # (tested from the home PC: HTTP 200). On a cloud server, run --test-blinkit first;
    # if it says BLOCKED there, set BLINKIT_WARP=1 (free Cloudflare WARP tunnel).
    enabled: true
    pincode: "271001"            # Gonda, Uttar Pradesh
    lat: 27.1375914              # coordinates for the pincode (Blinkit uses lat/lon, not the pin)
    lon: 81.9631560
    product_urls:
      # One page lists every value (₹1000–5000) as "pills"; all of them are tracked.
      - https://blinkit.com/prn/sony-playstation-instant-voucher/prid/698590
    fast_check: true             # also check every fast_interval_seconds
    interval_seconds: 120
    fast_interval_seconds: 30    # via WARP; Blinkit may block very frequent checks

  rooter:
    # https://shop.rooter.gg/product/playstation-gift-cards (Rs.1000–5000 wallet codes)
    enabled: true
    products: [playstation-gift-cards]
    fast_check: true             # also check every fast_interval_seconds (one page request)

  hubble:
    # https://offers.myhubble.money – PlayStation only shows up while it's in stock,
    # so the Gaming category is watched for it (one ~26 KB request).
    enabled: true
    categories: [GAMING]
    fast_check: true             # also check every fast_interval_seconds

  jiogames:
    # PSN cards appear in store.jiogames.com/collection/playstation when in stock and are
    # hidden completely when sold out. Restocks are daily, so also checked every
    # `fast_interval_seconds` (one small API call).
    enabled: true
    collections: [playstation]
    search_queries: [playstation, psn]
    fast_check: true
